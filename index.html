    <!-- Fonts: Sora (headings) + Inter (body) — from new theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background: #07050F;
        color: #F5F3FF;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Sora', sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      a:hover { color: #DDD6FE; }
      /* Scrollbar */
      ::-webkit-scrollbar { width: 7px; }
      ::-webkit-scrollbar-track { background: #07050F; }
      ::-webkit-scrollbar-thumb { background: #3B1D8F; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6D28D9; }
      ::selection { background: #7C3AED; color: #fff; }
      /* Animations */
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
      @keyframes shimmer { to{background-position:200% center} }
      @keyframes dash { to{stroke-dashoffset:-28} }
      @keyframes marquee { to{transform:translateX(-50%)} }
      @keyframes pulse-ring { 0%,100%{opacity:.45;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }
      @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
      @keyframes spin { to{transform:rotate(360deg)} }
      @keyframes ping { 0%{transform:scale(1);opacity:1} 75%,100%{transform:scale(2);opacity:0} }
      @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
