    :root {

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #FCA5A5;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #050508;
    }

    ::-webkit-scrollbar-thumb {
      background: #7F1D1D;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #DC2626;
    }

    ::selection {
      background: #EF4444;
      color: #FFFFFF;
    }

    /* Animations */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-12px)
      }
    }

    @keyframes drift {

      0%,
      100% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(40px, 30px)
      }
    }

    @keyframes shimmer {
      to {
        background-position: 200% center
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -28
      }
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%)
      }
    }

    @keyframes pulse-ring {

      0%,
      100% {
        opacity: .45;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.12)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: 1
      }

      75%,
      100% {
        transform: scale(2);
        opacity: 0
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
