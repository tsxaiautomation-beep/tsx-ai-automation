<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tsxPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030007" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="26" fill="#0A0216" />
  <circle cx="50" cy="50" r="45" fill="url(#purpleGlow)" opacity="0.4" />
  <rect width="98" height="98" x="1" y="1" rx="25" stroke="url(#tsxPurpleGrad)" stroke-width="2" stroke-opacity="0.7" />
  <!-- Circuit points -->
  <circle cx="26" cy="26" r="3.5" fill="#C084FC" filter="url(#neonBlur)" />
  <circle cx="74" cy="74" r="3.5" fill="#E879F9" filter="url(#neonBlur)" />
  <path d="M26 26 L50 42 L74 74" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <!-- TSX Glyph -->
  <path d="M28 38 L72 38 M50 38 L50 74" stroke="url(#tsxPurpleGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)" />
  <path d="M62 48 L76 61 L62 74" stroke="#E879F9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="54" r="4.5" fill="#FFFFFF" filter="url(#neonBlur)" />
</svg>
